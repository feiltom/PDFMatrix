[package]
name = "pdfnet-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
lopdf = "0.46"
hayro = { version = "0.8", features = ["embed-fonts", "embed-cmaps"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
regex = "1"
serde_json = "1"
ttf-parser = "0.25"
cms = { version = "0.2", features = ["builder"] }
p12-keystore = "0.4.1"
x509-cert = "0.2"
der = "0.7"
spki = "0.7"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
getrandom = "0.2"
signature = "2"
const-oid = { version = "0.9", features = ["db"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
base64 = "0.23.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
